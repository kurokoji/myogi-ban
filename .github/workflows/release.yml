name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.0.18)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out ${{ env.RELEASE_TAG }}
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json's version
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Lint
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Set up the OBS SDK
        shell: pwsh
        run: |
          pwsh -File scripts/setup-obs-sdk.ps1
          echo "OBS_SDK_DIR=$PWD\.obs-sdk" >> $env:GITHUB_ENV

      - name: Build the Windows installer
        # electron-builder auto-detects a CI run on a vX.Y.Z tag and tries to
        # publish to GitHub Releases itself unless told not to; this project
        # uploads assets in its own step below instead, so disable that.
        run: npm run build:dist -- --publish=never

      - name: Build the OBS plugin installer
        run: npm run build:obs-plugin-installer

      - name: Create or update the draft release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes ""
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            dist/Myogi\ Ban\ Setup\ *.exe \
            release/Myogi-Ban-OBS-Plugin-Setup-*.exe
